name: Tests

# CI scope: this workflow checks that the DAG builds and that every conda env
# referenced by a rule still resolves. It never runs the pipeline for real — that
# needs an SRA download, an NCBI assembly and hours of alignment/calling. A green
# run means "the workflow parses and its envs are installable", not "the results
# are correct".

on:
  push:
    branches: [main, caterpillar]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Formatting
        uses: super-linter/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_SNAKEMAKE_SNAKEFMT: true
          VALIDATE_YAML_PRETTIER: true

  Linting:
    runs-on: ubuntu-latest
    # Non-blocking: `snakemake --lint` currently fails on pre-existing issues —
    # most rules interpolate {config[...]} straight into shell: instead of going
    # through params:, and many have no log: directive. Flip this back to blocking
    # once those are fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: workflow/Snakefile
          args: "--lint"

  DryRun:
    name: Dry run (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default entry point: SRA download + read QC + alignment.
          - name: default
            configfile: ""
          # Pre-aligned BAM entry point: swaps rules/data_qc.smk + rules/mapping.smk
          # for rules/bam_input.smk, so it is a genuinely different DAG.
          - name: bam-mode
            configfile: .test/config_bam.yaml
          # Local reference FASTA instead of the NCBI copy.
          - name: local-reference
            configfile: .test/config_local_ref.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: workflow/envs/ci.yaml
          cache-environment: true

      # start_from_bam validates its BAM/BAI/FASTQ at parse time, so the placeholder
      # files have to exist before snakemake is invoked. Harmless for the other entries.
      - name: Create fixtures
        run: bash .test/setup_fixtures.sh

      # No --directory: rules hardcode paths relative to the repo root.
      # profiles/ci supplies default-resources cpus_per_task, which 14 rules
      # interpolate into shell: and which only the SLURM profile otherwise provides.
      - name: Dry run
        shell: bash -el {0}
        run: |
          snakemake -s workflow/Snakefile -n -p --profile profiles/ci \
            ${{ matrix.configfile && format('--configfile {0}', matrix.configfile) || '' }} \
            | tee dryrun.log

      # Patterns match rows of snakemake's job-count table ("rulename<spaces><count>"),
      # so they cannot be fooled by the same words appearing in paths or in the
      # "Reasons:" section.
      - name: Check BAM mode skips download and alignment
        if: matrix.name == 'bam-mode'
        run: |
          grep -qE '^stage_bam[[:space:]]+[0-9]+$' dryrun.log
          ! grep -qE '^(download_sra|chopper|minimap2|ngmlr)[[:space:]]+[0-9]+$' dryrun.log

      - name: Check the local reference FASTA reaches the shell command
        if: matrix.name == 'local-reference'
        run: grep -q 'Using the local reference FASTA .*ref.fna' dryrun.log

  ListEnvs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
      # Derived from the rules rather than globbed, so new envs are picked up
      # automatically and unreferenced/legacy env files do not fail the build.
      - id: list
        run: |
          envs=$(grep -rhoE 'envs/[A-Za-z0-9_.-]+\.yaml' workflow/rules workflow/*.smk \
                 | sort -u | sed 's|^envs/|workflow/envs/|' | jq -R . | jq -sc .)
          echo "Testing envs: $envs"
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

  CondaEnvs:
    name: Solve ${{ matrix.env }}
    needs: ListEnvs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.ListEnvs.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest

      # --dry-run resolves the dependency graph without downloading anything, which
      # catches stale pins and packages that have left the channels. It solves the
      # conda section only: the pip: blocks in nanoplot.yaml (kaleido) and
      # sniffles.yaml (sniffles2-plot) are NOT verified here.
      - name: Solve environment
        shell: bash -el {0}
        run: micromamba create --dry-run -y -n probe -f "${{ matrix.env }}"
