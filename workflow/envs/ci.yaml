name: ci
channels:
  - conda-forge
  - bioconda
dependencies:
  # Snakemake only, for DAG construction in CI. The pipeline's own tools are never
  # installed here: .test/ runs dry runs, it never executes a rule.
  #
  # pandas is listed explicitly because workflow/Snakefile imports it to read the
  # sample sheet at parse time. pytest and pyyaml drive .test/ (both arrive as
  # snakemake transitive deps, but the test suite imports them directly).
  - snakemake=8.29.3
  - pandas
  - pytest
  - pyyaml
