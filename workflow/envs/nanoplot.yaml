name: nanoplot
channels:
  - conda-forge
  - bioconda
dependencies:
  - nanoplot
  - openssl
  - htslib
  - pysam
  # plotly 7 removed figure_factory.create_2d_density, which NanoPlot 1.48.0 still
  # calls in nanoplotter.scatter(). bioconda-recipes#68974 pins the same range in
  # nanoplot build 1; pinning here keeps the solve correct even if build 0 is served.
  - conda-forge::plotly >=6.1.1,<7
  - python >=3.9
  - choreographer >=1.0.5
  - logistro >=1.0.8
  - orjson >=3.10.15
  - conda-forge::python-chromedriver-binary
  - pip
  - pip:
      - kaleido>=1.0.0
