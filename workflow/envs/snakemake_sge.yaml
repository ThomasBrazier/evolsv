name: snakemake_sge
channels:
  - conda-forge
  - bioconda
dependencies:
  # Environment for running Snakemake itself against profiles/sge, not an environment
  # for any rule. It is therefore absent from the CI conda matrix by construction:
  # .test/list_envs.py derives that matrix from the rules' conda: directives, and no
  # rule references this file.
  #
  # cluster-generic rather than snakemake-executor-plugin-sge: see the rationale at the
  # top of profiles/sge/config.yaml.
  - snakemake=8.29.3
  - snakemake-executor-plugin-cluster-generic=1.0.9
