name: snakemake_lsf
channels:
  - conda-forge
  - bioconda
dependencies:
  # Environment for running Snakemake itself against profiles/lsf, not an environment
  # for any rule. It is therefore absent from the CI conda matrix by construction:
  # .test/list_envs.py derives that matrix from the rules' conda: directives, and no
  # rule references this file.
  #
  # cluster-generic: no dedicated LSF executor plugin is in use; see the
  # header of profiles/lsf/config.yaml.
  - snakemake=8.29.3
  - snakemake-executor-plugin-cluster-generic=1.0.9
