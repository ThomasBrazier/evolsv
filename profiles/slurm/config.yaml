# Profile for the SLURM job scheduler.
#
# Site setup before the first run: set slurm_partition and slurm_account below.
# Note the double-quoted "'name'" form -- profile scalars are eval()'d before being
# accepted as strings, so a bare partition named `all`, `input` or `max` would
# resolve to a Python builtin and abort the run.
executor: slurm
use-conda: True
jobs: 25 # Have up to N jobs submitted at any given time
latency-wait: 100 # Wait N seconds for output files due to latency
retries: 6 # Retry jobs N times.

# Upper bound on the threads any single rule may claim. This is NOT a limit on
# concurrency (that is `jobs:`), and it must be >= the largest value in set-threads:
# `--cores N` clamps every rule's threads to N even in cluster mode, so a stray
# `--cores 1` on the command line silently drops all of set-threads to 1.
cores: 64

# These resources will be applied to all rules. Can be overriden on a per-rule basis below.
default-resources:
  # 14 rules interpolate {resources.cpus_per_task} into shell:. Deriving it from
  # `threads` keeps the CPU request, the tool's -t flag and set-threads in lockstep,
  # including after the --cores clamp, so thread counts are declared in exactly one
  # place. The SLURM plugin already defaults --cpus-per-task to the job's threads,
  # so this changes nothing about submission.
  cpus_per_task: threads
  mem_mb: attempt * 20000
  runtime: 2880 # In minutes
  slurm_partition: "'partition_name'"
  slurm_account: "'account_name'" # Same as sbatch -A. Not all clusters use this.

# Control number of threads each rule will use.
#
# svim and merging_qc pass no thread flag to their tool, so their
# values here are pure allocation reservations rather than parallelism.
set-threads:
  # Data acquisition. Single-threaded: network- and I/O-bound.
  download_sra: 1
  download_genome: 1
  sample_ids: 1
  merge_fastq: 1
  # Pre-aligned BAM input (start_from_bam). Symlinking only, no computation.
  stage_bam: 1
  stage_fastq: 1
  # Fastq processing. Can use more than 1 thread.
  fastqc: 16
  hifiadapterfilt: 16 # PacBio HiFi only
  porechop_abi: 16 # ONT only
  nanoplot: 4
  filter_reads_chopper: 16
  nanoplot_after_filtering: 4
  # Alignment. Can use more than 1 thread, except samtools_sort.
  minimap2: 16
  ngmlr: 16
  samtools_view: 1
  samtools_sort: 1 # Does NOT use more than 1 thread.
  samtools_index: 1
  samtools_stats: 1
  samtools_coverage: 1
  # Ensemble calling
  svim: 8
  sniffles: 8
  cutesv: 8
  debreak: 8
  removeBND: 1
  vcf_sv_specification: 1
  sniffles2plot: 1
  genotype_svim: 8
  genotype_cutesv: 8
  genotype_sniffles: 8
  genotype_debreak: 8
  basic_filter: 1
  # Merging
  jasmine: 16
  merging_qc: 1
  # Genotyping
  svjedigraph: 16
  autosomes_sexchromosomes: 1
  all_samples_vcf: 1
  final_vcf: 1
  # Report
  samplot_subset_DUP: 1
  samplot_subset_INV: 1
  samplot_subset_DEL: 1
  samplot_plot: 4
  vcf_to_tsv: 1
  vcf_to_tsv_tools: 1
  final_report: 1
  light_vcf: 1
  gzvcf: 1
  # Mappability and annotation
  mosdepth_summary: 4 # mosdepth: no gain beyond 4 BAM decompression threads
  mosdepth_quantize: 4
  callable_bed: 1
  genmap: 8
  mappability_bed: 1
  add_mappability: 1
  bwa_index: 1
  truvari_grm: 8

# Control other resources used by each rule. Rules absent from this block take the
# default-resources values above. cpus_per_task is deliberately never set here: it is
# derived from set-threads.
#
# Not yet measured: hifiadapterfilt, porechop_abi, genmap and bwa_index use the
# default mem_mb and runtime. Each writes a benchmark: file (max_rss, s); set their
# values here from a real run.
set-resources:
  download_sra:
    mem_mb: attempt * 2000
  download_genome:
    mem_mb: attempt * 2000
  stage_bam:
    mem_mb: attempt * 2000
  stage_fastq:
    mem_mb: attempt * 2000
  fastqc:
    # fastqc allocates 250Mb of RAM per thread, so mem_mb must scale with threads.
    mem_mb: attempt * threads * 1000
  minimap2:
    mem_mb: attempt * 20000
    runtime: 2880 * 4
  ngmlr:
    mem_mb: attempt * 20000
    runtime: 2880 * 12
  samtools_view:
    mem_mb: attempt * 2000
  samtools_index:
    mem_mb: attempt * 40000
  samtools_stats:
    mem_mb: attempt * 2000
  samtools_coverage:
    mem_mb: attempt * 2000
  svim:
    mem_mb: attempt * 50000
  sniffles:
    mem_mb: attempt * 50000
  cutesv:
    mem_mb: attempt * 50000
  debreak:
    mem_mb: attempt * 50000
  vcf_sv_specification:
    mem_mb: attempt * 200000
    qos: "'bigmem'"
  sniffles2plot:
    mem_mb: attempt * 60000
  genotype_svim:
    mem_mb: attempt * 20000
    qos: "'bigmem'"
  genotype_cutesv:
    mem_mb: attempt * 20000
    qos: "'bigmem'"
  genotype_sniffles:
    mem_mb: attempt * 20000
    qos: "'bigmem'"
  genotype_debreak:
    mem_mb: attempt * 40000
    qos: "'bigmem'"
  basic_filter:
    mem_mb: attempt * 2000
  jasmine:
    mem_mb: attempt * 200000
    qos: "'bigmem'"
  merging_qc:
    mem_mb: attempt * 20000
  svjedigraph:
    mem_mb: attempt * 20000
    qos: "'bigmem'"
  autosomes_sexchromosomes:
    mem_mb: attempt * 2000
  truvari_grm:
    mem_mb: attempt * 20000
